name: Track upstream

on:
  schedule:
    - cron: "37 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  sync:
    uses: codeandsolder/ci-workflows/.github/workflows/upstream-tracking.yml@1c9f5c8968c4caf8754c98ebeb0889d9e774b5ed # main
    with:
      upstream-repository: bytecodealliance/waffle
      upstream-branch: main
      target-branch: main
      strategy: merge
      rust-toolchain: stable
      validation-script: .github/scripts/validate-upstream.sh
