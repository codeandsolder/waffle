name: Track upstream

on:
  schedule:
    - cron: "37 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  sync:
    uses: codeandsolder/ci-workflows/.github/workflows/upstream-tracking.yml@ecf97ef6708aaba39d6afad83bb82ebcca84723a # main
    with:
      upstream-repository: bytecodealliance/waffle
      upstream-branch: main
      target-branch: main
      strategy: merge
      rust-toolchain: stable
      validation-script: .github/scripts/validate-upstream.sh
