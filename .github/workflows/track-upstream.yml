name: Track upstream

on:
  schedule:
    - cron: "37 4 * * *"
  workflow_dispatch:

concurrency:
  # Serialize manual and scheduled publication and failure reporting.
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      issues: read
    outputs:
      changed: ${{ steps.candidate.outputs.changed }}
      base: ${{ steps.candidate.outputs.base }}
      head: ${{ steps.candidate.outputs.head }}
      upstream: ${{ steps.candidate.outputs.upstream }}
      checked: ${{ steps.candidate.outputs.checked }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Merge upstream into candidate
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          base=$(git rev-parse HEAD)
          echo "base=$base" >> "$GITHUB_OUTPUT"
          git fetch --no-tags https://github.com/bytecodealliance/waffle.git main
          upstream=$(git rev-parse FETCH_HEAD)
          echo "upstream=$upstream" >> "$GITHUB_OUTPUT"
          echo "Base: $base; upstream: $upstream" >> "$GITHUB_STEP_SUMMARY"
          if git merge-base --is-ancestor "$upstream" "$base"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            # A manually resolved failure still needs a fresh validation.
            if [[ "$GITHUB_EVENT_NAME" != workflow_dispatch ]]; then
              issue=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json number,title --jq '.[] | select(.title == "Upstream tracking failed") | .number')
              if [[ -z "$issue" ]]; then
                echo "checked=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
          else
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' merge --no-ff --no-edit "$upstream"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "checked=true" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
        if: steps.candidate.outputs.checked == 'true'
        with:
          components: rustfmt
      - name: Setup mandatory sccache
        if: steps.candidate.outputs.checked == 'true'
        uses: codeandsolder/ci-workflows/.github/actions/setup-sccache@7bbede943ffd14ba2a534cf1296a20fd11c177ae
      - name: Test Waffle
        if: steps.candidate.outputs.checked == 'true'
        run: |
          cargo fmt --all -- --check
          cargo test
      - name: Checkout downstream
        if: steps.candidate.outputs.checked == 'true'
        uses: actions/checkout@v4
        with:
          repository: codeandsolder/js-redox
          ref: main
          path: downstream
          persist-credentials: false
      - name: Test wasm-redox with candidate
        if: steps.candidate.outputs.checked == 'true'
        working-directory: downstream
        shell: bash
        run: |
          set -euo pipefail
          echo "Downstream: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          sed -i 's|^waffle = .*|waffle = { path = ".." }|' Cargo.toml
          test "$(sed -n '/^waffle = { path = "\.\." }$/p' Cargo.toml)" = 'waffle = { path = ".." }'
          cargo test -p wasm-redox
      - name: Finalize mandatory sccache
        if: always() && steps.candidate.outputs.checked == 'true'
        uses: codeandsolder/ci-workflows/.github/actions/finalize-sccache@7bbede943ffd14ba2a534cf1296a20fd11c177ae
      - name: Bundle validated commit
        if: steps.candidate.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git bundle create "$RUNNER_TEMP/upstream.bundle" HEAD "^${{ steps.candidate.outputs.base }}"
      - uses: actions/upload-artifact@v4
        if: steps.candidate.outputs.changed == 'true'
        with:
          name: validated-commit
          path: ${{ runner.temp }}/upstream.bundle
          retention-days: 1

  publish:
    needs: validate
    if: needs.validate.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: validated-commit
          path: ${{ runner.temp }}
      - name: Fast-forward to exactly the validated commit
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ needs.validate.outputs.base }}"
          git fetch "$RUNNER_TEMP/upstream.bundle" HEAD
          test "$(git rev-parse FETCH_HEAD)" = "${{ needs.validate.outputs.head }}"
          git merge --ff-only FETCH_HEAD
          git push origin HEAD:main

  report:
    needs: [validate, publish]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - name: Maintain one upstream tracking failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATE: ${{ needs.validate.result }}
          PUBLISH: ${{ needs.publish.result }}
          CHECKED: ${{ needs.validate.outputs.checked }}
          BASE: ${{ needs.validate.outputs.base }}
          UPSTREAM: ${{ needs.validate.outputs.upstream }}
        shell: bash
        run: |
          set -euo pipefail
          title="Upstream tracking failed"
          repo="$GITHUB_REPOSITORY"
          run_url="$GITHUB_SERVER_URL/$repo/actions/runs/$GITHUB_RUN_ID"
          issue=$(gh issue list --repo "$repo" --state open --limit 100 --json number,title --jq '.[] | select(.title == "Upstream tracking failed") | .number' | head -n1)
          if [[ "$VALIDATE" != success || "$PUBLISH" == failure || "$PUBLISH" == cancelled ]]; then
            body=$(printf 'Automatic synchronization with bytecodealliance/waffle failed.\n\nValidation: %s\nPublication: %s\nFork base: %s\nUpstream revision: %s\n\nLatest run: %s\n\nInspect the failed step, resolve conflicts or regressions, and rerun Track upstream. The tracking branch remains on its last accepted revision unless publication already completed.\n' "$VALIDATE" "$PUBLISH" "$BASE" "$UPSTREAM" "$run_url")
            if [[ -n "$issue" ]]; then
              gh issue edit "$issue" --repo "$repo" --body "$body"
            else
              gh issue create --repo "$repo" --title "$title" --body "$body"
            fi
            exit 1
          fi
          if [[ "$CHECKED" == true && -n "$issue" ]]; then
            gh issue close "$issue" --repo "$repo" --comment "Validation recovered: $run_url"
          fi
