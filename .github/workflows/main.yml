name: CI

on: pull_request

env:
  CARGO_TERM_COLOR: always

# Discard superseded PR revisions; keep independent events and PRs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    uses: codeandsolder/ci-workflows/.github/workflows/rust-sccache.yml@436a7b79fe974fd4e7549c945eefbb9b00c2522b # main
    with:
      command: |
        cargo fmt --all -- --check
        cargo build --verbose
        cargo test --verbose --features cli,dwarf,parallel

  check_fuzz:
    uses: codeandsolder/ci-workflows/.github/workflows/rust-sccache.yml@436a7b79fe974fd4e7549c945eefbb9b00c2522b # main
    with:
      command: |
        cargo install cargo-fuzz --locked
        cargo fuzz check --dev -s none
        cargo fuzz run -s none parse_ir -- -max_total_time=30
